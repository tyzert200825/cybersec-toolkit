<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elara Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e14;color:#d4d4d4;font-family:'SF Mono','Fira Code','Courier New',monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.bar{background:#11161f;border-bottom:1px solid #1e2733;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.bar-l{display:flex;align-items:center;gap:12px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot-r{background:#ff5f56}.dot-y{background:#ffbd2e}.dot-g{background:#27c93f}
.bar-t{color:#6b7280;font-size:12px;margin-left:8px}
.bar-r{font-size:11px;color:#6b7280}
#term{flex:1;overflow-y:auto;padding:16px;font-size:13px;line-height:1.6;scroll-behavior:smooth}
.line{white-space:pre-wrap;word-break:break-word}
.prompt{color:#00d4aa}
.cmd{color:#d4d4d4}
.out{color:#d4d4d4}
.err{color:#ff4757}
.dim{color:#6b7280}
.ok{color:#27c93f}
.warn{color:#ffbd2e}
.info{color:#54a0ff}
.input-line{display:flex;align-items:center;gap:4px}
.input-line .prompt{color:#00d4aa;white-space:nowrap}
#input{flex:1;background:transparent;border:none;color:#d4d4d4;font-family:inherit;font-size:13px;outline:none;caret-color:#00d4aa}
.cred{color:#ff4757}
#cursor{width:8px;height:16px;background:#00d4aa;display:inline-block;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #1e2733;border-top-color:#00d4aa;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#0a0e14}::-webkit-scrollbar-thumb{background:#1e2733;border-radius:3px}
@media(max-width:768px){#term{font-size:12px;padding:12px}}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-l"><span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span><span class="bar-t">elara@sandbox: ~</span></div>
  <div class="bar-r" id="status">● connecting...</div>
</div>
<div id="term"></div>
<div class="input-line">
  <span class="prompt">elara@sandbox:~$</span>
  <input type="text" id="input" autofocus autocomplete="off" spellcheck="false" placeholder="type a command (try 'help')">
</div>

<script>
const AUTH="Fuckyou25.!";
const API="https://elara-6512927d.base44.app/functions/webshell";
const term=document.getElementById('term');
const input=document.getElementById('input');
const statusEl=document.getElementById('status');
let history=[];let hIdx=-1;let busy=false;

function print(text,cls='out'){const d=document.createElement('div');d.className='line '+cls;d.textContent=text;term.appendChild(d);term.scrollTop=term.scrollHeight}
function printHTML(html){const d=document.createElement('div');d.className='line';d.innerHTML=html;term.appendChild(d);term.scrollTop=term.scrollHeight}
function showPrompt(cmd=''){printHTML('<span class="prompt">elara@sandbox:~$</span> <span class="cmd">'+esc(cmd)+'</span>')}

function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Boot
async function boot(){
  try{
    const r=await fetch(API);const d=await r.json();
    statusEl.textContent='● online';
    statusEl.style.color='#27c93f';
    print('Elara WebShell v1.0','ok');
    print('Connected to sandbox pipeline engine.','dim');
    print('Type "help" for available commands.','dim');
    print('');
  }catch(e){
    statusEl.textContent='● offline';
    statusEl.style.color='#ff4757';
    print('Failed to connect to backend.','err');
  }
  showPrompt();
}

async function runCmd(cmd){
  if(!cmd.trim())return;
  history.push(cmd);hIdx=history.length;
  showPrompt(cmd);
  
  if(cmd.trim().toLowerCase()==='clear'){term.innerHTML='';return}
  
  const spinner=document.createElement('div');
  spinner.className='line dim';
  spinner.innerHTML='<span class="spinner"></span>executing...';
  term.appendChild(spinner);
  term.scrollTop=term.scrollHeight;
  
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({command:cmd,authKey:AUTH})
    });
    const d=await r.json();
    spinner.remove();
    
    if(d.output==='__CLEAR__'){term.innerHTML='';return}
    
    // Colorize output
    let output=d.output||'';
    if(d.error){
      print(d.error,'err');
    }
    if(output){
      // Split lines and colorize keywords
      const lines=output.split('\n');
      for(const line of lines){
        if(!line)continue;
        let cls='out';
        const lower=line.toLowerCase();
        if(lower.includes('critical')||lower.includes('⚠')||lower.includes('secrets found'))cls='err';
        else if(lower.includes('✅')||lower.includes('valid')||lower.includes('complete')||lower.includes('online'))cls='ok';
        else if(lower.includes('❌')||lower.includes('invalid')||lower.includes('error')||lower.includes('failed'))cls='err';
        else if(lower.includes('warning')||lower.includes('exposed')||lower.includes('missing'))cls='warn';
        else if(lower.includes('found')||lower.includes('detected')||lower.includes('ports:'))cls='info';
        else if(line.startsWith('—')||line.startsWith('==')||line.startsWith('  '))cls='dim';
        print(line,cls);
      }
    }
  }catch(e){
    spinner.remove();
    print('Connection error: '+e.message,'err');
  }
  print('');
}

input.addEventListener('keydown',e=>{
  if(busy)return;
  if(e.key==='Enter'){
    const cmd=input.value;
    input.value='';
    runCmd(cmd);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(hIdx>0){hIdx--;input.value=history[hIdx]||''}
  }else if(e.key==='ArrowDown'){
    e.preventDefault();
    if(hIdx<history.length-1){hIdx++;input.value=history[hIdx]||''}
    else{hIdx=history.length;input.value=''}
  }else if(e.key==='Tab'){
    e.preventDefault();
    // Simple autocomplete
    const cmds=['help','status','pipelines','findings','clear','scan','verify','bruteforce','crypto','shodan','subfinder','website','database','github','nuclei','nmap','oops','dorker','paste','google','fullscan','recon','echo'];
    const val=input.value.toLowerCase();
    const match=cmds.find(c=>c.startsWith(val));
    if(match)input.value=match+' ';
  }
});

// Keep input focused
document.addEventListener('click',()=>input.focus());
boot();
</script>
</body>
</html>
